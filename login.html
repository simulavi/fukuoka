<!doctype html>
<html lang="ko">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fff;
    }
    main {
      display: grid;
      gap: 12px;
      width: min(300px, calc(100% - 48px));
    }
    a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-sizing: border-box;
      height: 40px;
      text-decoration: none;
      font-size: 14px;
      line-height: 1;
    }
    a svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }
    #google {
      border: 1px solid #747775;
      border-radius: 4px;
      background: #fff;
      color: #1f1f1f;
      font-family: Roboto, Arial, sans-serif;
      font-weight: 500;
    }
    #google:hover {
      background: #f8f9fa;
      box-shadow: 0 1px 2px #3c40434d, 0 1px 3px 1px #3c404326;
    }
    #kakao {
      height: 45px;
      border-radius: 12px;
      background: #fee500;
      color: #191919;
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      font-weight: 600;
    }
    #kakao:hover {
      background: #f5dc00;
    }
  </style>
  <main>
    <a id="google" href="#">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.7-.4-3.9z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.3 35.1 26.8 36 24 36c-5.3 0-9.8-3.4-11.4-8.1l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.3 4.2-4.2 5.6l6.3 5.3C40.2 35.9 44 30.6 44 24c0-1.3-.1-2.7-.4-3.9z"/>
      </svg>
      Google로 로그인
    </a>
    <a id="kakao" href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#191919" d="M12 3C6.5 3 2 6.4 2 10.6c0 2.7 1.8 5 4.5 6.4l-1.1 4.1c-.1.4.3.7.7.5l4.8-3.2c.4 0 .7.1 1.1.1 5.5 0 10-3.4 10-7.6S17.5 3 12 3z"/>
      </svg>
      카카오 로그인
    </a>
  </main>
  <script>
    const cafe24 = "https://도메인";
    document.querySelector("#google").href = cafe24 + "/auth/start.php?provider=google";
    document.querySelector("#kakao").href = cafe24 + "/auth/start.php?provider=kakao";
  </script>
</html>
